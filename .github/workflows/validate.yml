name: CI / Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --verify "${PUSH_SHA}~1" >/dev/null 2>&1; then
              range="${PUSH_SHA}~1..${PUSH_SHA}"
            else
              range="$PUSH_SHA"
            fi
          else
            range="$BEFORE_SHA..$PUSH_SHA"
          fi
          message_file="$(mktemp)"
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > "$message_file"
            sh .githooks/commit-msg "$message_file"
          done
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
      - name: Install Python
        run: uv python install 3.14
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint and type-check
        run: sh .githooks/pre-commit
      - name: Test
        working-directory: backend
        run: uv run --locked python -m pytest
      - name: E2E
        working-directory: backend
        run: uv run --locked python tools/e2e_event_chat.py
