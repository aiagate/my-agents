[project]
name = "my-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flow-res>=0.2.0",
    "pydantic-ai-slim[openai]>=2.71.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
my-agents = "my_agents:main"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty==0.0.108",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "DTZ",    # flake8-datetimez
    "ERA001", # eradicate commented-out code
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "SLF001", # flake8-self private member access
    "T201",   # flake8-print
    "TID251", # flake8-tidy-imports banned-api
    "PGH003", # require specific error codes on type: ignore
    "PGH004", # require specific rule codes on noqa
    "RUF100", # unused noqa directives
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Do not use 'from __future__ import annotations' on Python 3.14+ (PEP 649 is standard)."
"typing.Any".msg = "Avoid typing.Any; use concrete types, TypeVar, or None/object. Do not blindly replace contravariant generic parameters (e.g. Agent[None, str] deps) with object."

[tool.ruff.lint.per-file-ignores]
"tools/project_lint/__init__.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"
root = ["./src", "."]

[tool.ty.src]
include = ["./src/my_agents", "./tests", "./tools"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--cov"]

[tool.coverage.run]
source = ["src/my_agents"]
branch = true
omit = [
    "src/my_agents/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "case _:\\s*\\n\\s*assert_never\\(",
    "assert_never\\(",
]
