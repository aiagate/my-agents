# PLaMo 3 Translate uses PFML3 chat_template where a leading `system` message
# is parsed as `[plamo-translate]` settings + reference context.
# Inspect the logged rendered sample on the first run to verify prompt formatting.
model_id: "pfnet/plamo-3-translate-2b"
trust_remote_code: true
chat_template_kwargs: {}
quantization: "none"
max_seq_length: 1024

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # Targets fused qkv_proj / gate_up_proj as well as o_proj / down_proj.
  target_modules: "all-linear"

train:
  num_train_epochs: 3
  learning_rate: 1.0e-4
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  eval_steps: 20
  save_steps: 20
  logging_steps: 5
  seed: 42
  gradient_checkpointing: true

merge_on_finish: true
